<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nabataty Dashboard - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .admin-header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .admin-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .admin-header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .admin-content {
            padding: 40px;
        }

        .section {
            margin-bottom: 40px;
            padding: 30px;
            background: #f8fafc;
            border-radius: 15px;
            border: 1px solid #e2e8f0;
        }

        .section-title {
            font-size: 1.5rem;
            color: #1e293b;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .data-table th, .data-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        .data-table th {
            background: #f8fafc;
            font-weight: 600;
            color: #374151;
        }

        .data-table tr:hover {
            background: #f9fafb;
        }

        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .status-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .status-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .quick-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #4f46e5;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #6b7280;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .admin-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1><i class="fas fa-cogs"></i> Admin Panel</h1>
            <p>Manage your Nabataty Dashboard data in real-time</p>
        </div>

        <div class="admin-content">
            <!-- Status Message -->
            <div id="statusMessage" class="status-message"></div>

            <!-- Quick Stats -->
            <div class="quick-stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalOrders2025">-</div>
                    <div class="stat-label">Total Orders 2025</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalRevenue2025">-</div>
                    <div class="stat-label">Total Revenue 2025</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalOrders2024">-</div>
                    <div class="stat-label">Total Orders 2024</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalRevenue2024">-</div>
                    <div class="stat-label">Total Revenue 2024</div>
                </div>
            </div>

            <!-- Single Day Update -->
            <div class="section">
                <h2 class="section-title">
                    <i class="fas fa-calendar-day"></i>
                    Update Single Day Data
                </h2>
                <form id="singleDayForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="updateDate">Date</label>
                            <input type="date" id="updateDate" required>
                        </div>
                        <div class="form-group">
                            <label for="updateRevenue">Revenue ($)</label>
                            <input type="number" id="updateRevenue" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="updateOrders">Orders</label>
                            <input type="number" id="updateOrders" min="0" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Update Data
                    </button>
                </form>
            </div>

            <!-- Bulk Data Update -->
            <div class="section">
                <h2 class="section-title">
                    <i class="fas fa-upload"></i>
                    Bulk Data Update
                </h2>
                <div class="form-group">
                    <label for="csvData">CSV Data (Date, Revenue, Orders)</label>
                    <textarea id="csvData" rows="6" style="width: 100%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 10px; font-family: monospace;" 
                              placeholder="2025-01-01,500,10&#10;2025-01-02,750,15&#10;2025-01-03,600,12"></textarea>
                </div>
                <button type="button" id="bulkUpdateBtn" class="btn btn-success">
                    <i class="fas fa-database"></i> Bulk Update
                </button>
            </div>

            <!-- Recent Data View -->
            <div class="section">
                <h2 class="section-title">
                    <i class="fas fa-table"></i>
                    Recent Data (Last 10 Days)
                </h2>
                <button type="button" id="refreshDataBtn" class="btn btn-primary">
                    <i class="fas fa-refresh"></i> Refresh Data
                </button>
                <table class="data-table" id="recentDataTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Revenue</th>
                            <th>Orders</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="recentDataBody">
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>
            </div>

            <!-- Navigation -->
            <div style="text-align: center; margin-top: 40px;">
                <a href="/" class="btn btn-primary">
                    <i class="fas fa-chart-bar"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';

        // Load initial data
        document.addEventListener('DOMContentLoaded', function() {
            loadMetrics();
            loadRecentData();
        });

        // Load summary metrics
        async function loadMetrics() {
            try {
                const response = await fetch(`${API_BASE}/metrics`);
                const metrics = await response.json();
                updateMetricsDisplay(metrics);
            } catch (error) {
                console.error('Error loading metrics:', error);
            }
        }

        // Load recent data
        async function loadRecentData() {
            try {
                const response = await fetch(`${API_BASE}/recent?limit=10`);
                const data = await response.json();
                
                const tbody = document.getElementById('recentDataBody');
                tbody.innerHTML = '';
                
                data.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.date}</td>
                        <td>$${row.revenue.toLocaleString()}</td>
                        <td>${row.orders.toLocaleString()}</td>
                        <td>
                            <button onclick="deleteDay('${row.date}')" class="btn btn-danger" style="padding: 6px 12px; font-size: 14px;">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error loading recent data:', error);
            }
        }

        // Show status message
        function showStatus(message, type = 'success') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message status-${type}`;
            statusEl.style.display = 'block';
            
            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 5000);
        }

        // Single day form submission
        document.getElementById('singleDayForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const date = document.getElementById('updateDate').value;
            const revenue = parseFloat(document.getElementById('updateRevenue').value);
            const orders = parseInt(document.getElementById('updateOrders').value);
            
            try {
                const response = await fetch(`${API_BASE}/data/day`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ date, revenue, orders })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showStatus('Data updated successfully!', 'success');
                    loadMetrics();
                    loadRecentData();
                    this.reset();
                } else {
                    showStatus(result.error || 'Error updating data', 'error');
                }
            } catch (error) {
                showStatus('Network error: ' + error.message, 'error');
            }
        });

        // Bulk update
        document.getElementById('bulkUpdateBtn').addEventListener('click', async function() {
            const csvData = document.getElementById('csvData').value.trim();
            
            if (!csvData) {
                showStatus('Please enter CSV data', 'error');
                return;
            }
            
            try {
                const lines = csvData.split('\n');
                const data = lines.map(line => {
                    const [date, revenue, orders] = line.split(',');
                    return {
                        date: date.trim(),
                        revenue: parseFloat(revenue.trim()),
                        orders: parseInt(orders.trim())
                    };
                });
                
                const response = await fetch(`${API_BASE}/data/bulk`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ data })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showStatus(result.message, 'success');
                    loadMetrics();
                    loadRecentData();
                    document.getElementById('csvData').value = '';
                } else {
                    showStatus(result.error || 'Error updating data', 'error');
                }
            } catch (error) {
                showStatus('Error processing CSV data: ' + error.message, 'error');
            }
        });

        // Delete day data
        async function deleteDay(date) {
            if (!confirm(`Are you sure you want to delete data for ${date}?`)) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/data/day/${date}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showStatus('Data deleted successfully!', 'success');
                    loadMetrics();
                    loadRecentData();
                } else {
                    showStatus(result.error || 'Error deleting data', 'error');
                }
            } catch (error) {
                showStatus('Network error: ' + error.message, 'error');
            }
        }

        // Refresh data
        document.getElementById('refreshDataBtn').addEventListener('click', function() {
            loadMetrics();
            loadRecentData();
            showStatus('Data refreshed!', 'success');
        });
    </script>
</body>
</html>
